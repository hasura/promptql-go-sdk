openapi: 3.1.0
info:
  description: PromptQL API
  title: PromptQL API
  version: 0.0.1
servers:
- url: /
paths:
  /execute_program:
    post:
      operationId: execute_program_execute_program_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptQlExecutionResult'
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Execute Program
  /query:
    post:
      operationId: query_query_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request_1'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
            text/event-stream:
              example: |+
                data: {"message":"Let me try to store an artifact","plan":null,"code":null,"automation_code":null,"code_output":null,"code_error":null,"type":"assistant_action_chunk","index":0}

                data: {"message":null,"plan":"- Store an artifact with sample data","code":null,"automation_code":null,"code_output":null,"code_error":null,"type":"assistant_action_chunk","index":0}

                data: {"message":null,"plan":null,"code":"executor.store_artitfact('test', 'Test artifact', 'table', [{'foo':'bar'}])","automation_code":null,"code_output":null,"code_error":null,"type":"assistant_action_chunk","index":0}

                data: {"message":null,"plan":null,"code":null,"automation_code":null,"code_output":"Artifact stored","code_error":null,"type":"assistant_action_chunk","index":0}

                data: {"type":"artifact_update_chunk","artifact":{"identifier":"test","title":"Test Artifact","artifact_type":"table","data":[{"foo":"bar"}]}}

                data: {"message":"Your artifact is <artifact","plan":null,"code":null,"automation_code":null,"code_output":null,"code_error":null,"type":"assistant_action_chunk","index":1}

                data: {"message":" identifier='test'/>","plan":null,"code":null,"automation_code":null,"code_output":null,"code_error":null,"type":"assistant_action_chunk","index":1}

                data: {"type":"thread_metadata_chunk","thread_id":"00000000-0000-0000-0000-000000000000"}

              schema:
                $ref: '#/components/schemas/QueryResponseChunk'
          description: Either a JSON response (QueryResponse object) or a stream of
            Server-Sent Events (SSE) (QueryResponseChunk objects) depending on whether
            the 'stream' parameter was set
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Query
components:
  schemas:
    ApiAnthropicConfig:
      properties:
        provider:
          enum:
          - anthropic
          title: Provider
          type: string
        model:
          nullable: true
          type: string
        base_url:
          nullable: true
          type: string
        api_key:
          title: Api Key
          type: string
      required:
      - api_key
      - provider
      title: ApiAnthropicConfig
    ApiOpenAIConfig:
      properties:
        provider:
          enum:
          - openai
          title: Provider
          type: string
        model:
          nullable: true
          type: string
        base_url:
          nullable: true
          type: string
        api_key:
          title: Api Key
          type: string
      required:
      - api_key
      - provider
      title: ApiOpenAIConfig
    ApiThreadAssistantAction:
      example:
        code: code
        code_error: code_error
        message: message
        automation_code: automation_code
        plan: plan
        code_output: code_output
      properties:
        message:
          nullable: true
          type: string
        plan:
          nullable: true
          type: string
        code:
          nullable: true
          type: string
        automation_code:
          nullable: true
          type: string
        code_output:
          nullable: true
          type: string
        code_error:
          nullable: true
          type: string
      title: ApiThreadAssistantAction
    ApiThreadInteraction:
      properties:
        user_message:
          $ref: '#/components/schemas/ApiThreadUserMessage'
        assistant_actions:
          items:
            $ref: '#/components/schemas/ApiThreadAssistantAction'
          type: array
        error:
          nullable: true
          type: string
        completion_timestamp:
          format: date-time
          nullable: true
          type: string
        canceled_timestamp:
          format: date-time
          nullable: true
          type: string
        error_timestamp:
          format: date-time
          nullable: true
          type: string
      required:
      - user_message
      title: ApiThreadInteraction
    ApiThreadUserMessage:
      properties:
        text:
          title: Text
          type: string
      required:
      - text
      title: ApiThreadUserMessage
    AutomationArtifact:
      properties:
        identifier:
          title: Identifier
          type: string
        title:
          title: Title
          type: string
        artifact_type:
          enum:
          - automation
          title: Artifact Type
          type: string
        data:
          $ref: '#/components/schemas/AutomationArtifactData'
      required:
      - artifact_type
      - data
      - identifier
      - title
      title: AutomationArtifact
    AutomationArtifactData:
      description: |-
        Data structure for automation artifacts containing code and parsed schemas.

        Attributes:
            code: The Python code for the automation
            input_schema: Parsed JSON schema for input validation (extracted from code comments)
            output_schema: Parsed JSON schema for output validation (extracted from code comments)
      properties:
        code:
          title: Code
          type: string
        input_schema:
          additionalProperties: true
          nullable: true
          type: object
        output_schema:
          additionalProperties: true
          nullable: true
          type: object
      required:
      - code
      title: AutomationArtifactData
    DdnConfig:
      example:
        headers:
          key: headers
        url: url
      properties:
        url:
          description: URL of the /sql endpoint on Hasura DDN
          title: Url
          type: string
        headers:
          additionalProperties:
            type: string
          description: HTTP headers that should be forwarded to DDN
          title: Headers
      required:
      - url
      title: DdnConfig
    DdnConfigV2:
      properties:
        build_id:
          format: uuid
          nullable: true
          type: string
        build_version:
          nullable: true
          type: string
        headers:
          additionalProperties:
            type: string
          description: HTTP headers that should be forwarded to DDN
          title: Headers
      title: DdnConfigV2
    ExecuteRequestV1:
      example:
        code: code
        ai_primitives_llm:
          provider: hasura
        promptql_api_key: promptql_api_key
        version: v1
        ddn:
          headers:
            key: headers
          url: url
        artifacts:
        - identifier: identifier
          artifact_type: text
          data: data
          title: title
        - identifier: identifier
          artifact_type: text
          data: data
          title: title
      properties:
        version:
          enum:
          - v1
          nullable: true
          type: string
        code:
          title: Code
          type: string
        promptql_api_key:
          nullable: true
          type: string
        ai_primitives_llm:
          $ref: '#/components/schemas/ExecuteRequestV1_ai_primitives_llm'
        ddn:
          $ref: '#/components/schemas/DdnConfig'
        artifacts:
          items:
            $ref: '#/components/schemas/ExecuteRequestV1_artifacts_inner'
          type: array
      required:
      - ai_primitives_llm
      - artifacts
      - code
      - ddn
      title: ExecuteRequestV1
    ExecuteRequestV2:
      properties:
        version:
          enum:
          - v2
          title: Version
          type: string
        code:
          title: Code
          type: string
        ddn:
          $ref: '#/components/schemas/DdnConfigV2'
        artifacts:
          items:
            $ref: '#/components/schemas/ExecuteRequestV1_artifacts_inner'
          type: array
      required:
      - code
      - version
      title: ExecuteRequestV2
    HTTPValidationError:
      example:
        detail:
        - msg: msg
          loc:
          - ValidationError_loc_inner
          - ValidationError_loc_inner
          type: type
        - msg: msg
          loc:
          - ValidationError_loc_inner
          - ValidationError_loc_inner
          type: type
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
      title: HTTPValidationError
    HasuraLlmConfigV1:
      example:
        provider: hasura
      properties:
        provider:
          enum:
          - hasura
          title: Provider
          type: string
      required:
      - provider
      title: HasuraLlmConfigV1
    LlmUsage:
      example:
        provider: unknown
        model: unknown
        output_tokens: 6
        input_tokens: 0
        cached_tokens: 1
      properties:
        provider:
          default: unknown
          title: Provider
          type: string
        model:
          default: unknown
          title: Model
          type: string
        input_tokens:
          default: 0
          title: Input Tokens
          type: integer
        output_tokens:
          default: 0
          title: Output Tokens
          type: integer
        cached_tokens:
          default: 0
          title: Cached Tokens
          type: integer
      title: LlmUsage
    PromptQlExecutionResult:
      example:
        output: output
        llm_usages:
        - provider: unknown
          model: unknown
          output_tokens: 6
          input_tokens: 0
          cached_tokens: 1
        - provider: unknown
          model: unknown
          output_tokens: 6
          input_tokens: 0
          cached_tokens: 1
        error: error
        accessed_artifact_ids:
        - accessed_artifact_ids
        - accessed_artifact_ids
        modified_artifacts:
        - identifier: identifier
          artifact_type: text
          data: data
          title: title
        - identifier: identifier
          artifact_type: text
          data: data
          title: title
      properties:
        output:
          title: Output
          type: string
        error:
          nullable: true
          type: string
        accessed_artifact_ids:
          items:
            type: string
          type: array
        modified_artifacts:
          items:
            $ref: '#/components/schemas/ExecuteRequestV1_artifacts_inner'
          type: array
        llm_usages:
          items:
            $ref: '#/components/schemas/LlmUsage'
          type: array
      required:
      - accessed_artifact_ids
      - error
      - llm_usages
      - modified_artifacts
      - output
      title: PromptQlExecutionResult
    QueryRequestV1:
      properties:
        stream:
          title: Stream
          type: boolean
        artifacts:
          items:
            $ref: '#/components/schemas/ExecuteRequestV1_artifacts_inner'
          type: array
        timezone:
          description: An IANA timezone used to interpret queries that implicitly
            require timezones
          title: Timezone
          type: string
        interactions:
          items:
            $ref: '#/components/schemas/ApiThreadInteraction'
          type: array
        version:
          enum:
          - v1
          title: Version
          type: string
        promptql_api_key:
          nullable: true
          type: string
        llm:
          $ref: '#/components/schemas/Llm'
        ai_primitives_llm:
          $ref: '#/components/schemas/ExecuteRequestV1_ai_primitives_llm'
        ddn:
          $ref: '#/components/schemas/DdnConfig'
        system_instructions:
          nullable: true
          type: string
      required:
      - ddn
      - interactions
      - stream
      - timezone
      - version
      title: QueryRequestV1
    QueryRequestV2:
      properties:
        stream:
          title: Stream
          type: boolean
        artifacts:
          items:
            $ref: '#/components/schemas/ExecuteRequestV1_artifacts_inner'
          type: array
        timezone:
          description: An IANA timezone used to interpret queries that implicitly
            require timezones
          title: Timezone
          type: string
        interactions:
          items:
            $ref: '#/components/schemas/ApiThreadInteraction'
          type: array
        version:
          enum:
          - v2
          title: Version
          type: string
        ddn:
          $ref: '#/components/schemas/DdnConfigV2'
      required:
      - ddn
      - interactions
      - stream
      - timezone
      - version
      title: QueryRequestV2
    QueryResponse:
      example:
        thread_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        assistant_actions:
        - code: code
          code_error: code_error
          message: message
          automation_code: automation_code
          plan: plan
          code_output: code_output
        - code: code
          code_error: code_error
          message: message
          automation_code: automation_code
          plan: plan
          code_output: code_output
        modified_artifacts:
        - identifier: identifier
          artifact_type: text
          data: data
          title: title
        - identifier: identifier
          artifact_type: text
          data: data
          title: title
      properties:
        thread_id:
          format: uuid
          title: Thread Id
          type: string
        assistant_actions:
          items:
            $ref: '#/components/schemas/ApiThreadAssistantAction'
          type: array
        modified_artifacts:
          description: List of artifacts created or updated in this request. May contain
            duplicate artifact identifiers.
          items:
            $ref: '#/components/schemas/ExecuteRequestV1_artifacts_inner'
          type: array
      required:
      - assistant_actions
      - modified_artifacts
      - thread_id
      title: QueryResponse
    TableArtifact:
      properties:
        identifier:
          title: Identifier
          type: string
        title:
          title: Title
          type: string
        artifact_type:
          enum:
          - table
          title: Artifact Type
          type: string
        data:
          description: "Table data as a list of objects, with the object keys being\
            \ column names"
          items:
            additionalProperties: true
            nullable: true
            type: object
          type: array
      required:
      - artifact_type
      - data
      - identifier
      - title
      title: TableArtifact
    TextArtifact:
      example:
        identifier: identifier
        artifact_type: text
        data: data
        title: title
      properties:
        identifier:
          title: Identifier
          type: string
        title:
          title: Title
          type: string
        artifact_type:
          enum:
          - text
          title: Artifact Type
          type: string
        data:
          title: Data
          type: string
      required:
      - artifact_type
      - data
      - identifier
      - title
      title: TextArtifact
    ValidationError:
      example:
        msg: msg
        loc:
        - ValidationError_loc_inner
        - ValidationError_loc_inner
        type: type
      properties:
        loc:
          items:
            $ref: '#/components/schemas/ValidationError_loc_inner'
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VisualizationArtifact:
      properties:
        identifier:
          title: Identifier
          type: string
        title:
          title: Title
          type: string
        artifact_type:
          enum:
          - visualization
          title: Artifact Type
          type: string
        data:
          $ref: '#/components/schemas/VisualizationArtifactData'
      required:
      - artifact_type
      - data
      - identifier
      - title
      title: VisualizationArtifact
    VisualizationArtifactData:
      description: |-
        Data structure for visualization artifacts containing HTML and associated data.

        Attributes:
            html: The HTML markup for rendering the visualization
            visualization_data: The underlying data used to generate the visualization
      properties:
        html:
          title: Html
          type: string
        visualization_data: {}
      required:
      - html
      - visualization_data
      title: VisualizationArtifactData
    QueryResponseChunk:
      discriminator:
        mapping:
          artifact_update_chunk: '#/components/schemas/ArtifactUpdateChunk'
          assistant_action_chunk: '#/components/schemas/AssistantActionChunk'
          error_chunk: '#/components/schemas/ErrorChunk'
          thread_metadata_chunk: '#/components/schemas/ThreadMetadataChunk'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/ThreadMetadataChunk'
      - $ref: '#/components/schemas/AssistantActionChunk'
      - $ref: '#/components/schemas/ArtifactUpdateChunk'
      - $ref: '#/components/schemas/ErrorChunk'
    ArtifactUpdateChunk:
      properties:
        type:
          enum:
          - artifact_update_chunk
          title: Type
          type: string
        artifact:
          $ref: '#/components/schemas/Artifact'
      required:
      - artifact
      - type
      title: ArtifactUpdateChunk
    AssistantActionChunk:
      properties:
        message:
          nullable: true
          type: string
        plan:
          nullable: true
          type: string
        code:
          nullable: true
          type: string
        automation_code:
          nullable: true
          type: string
        code_output:
          nullable: true
          type: string
        code_error:
          nullable: true
          type: string
        type:
          enum:
          - assistant_action_chunk
          title: Type
          type: string
        index:
          title: Index
          type: integer
      required:
      - index
      - type
      title: AssistantActionChunk
    ErrorChunk:
      properties:
        type:
          enum:
          - error_chunk
          title: Type
          type: string
        error:
          title: Error
          type: string
      required:
      - error
      - type
      title: ErrorChunk
    ThreadMetadataChunk:
      properties:
        type:
          enum:
          - thread_metadata_chunk
          title: Type
          type: string
        thread_id:
          format: uuid
          title: Thread Id
          type: string
      required:
      - thread_id
      - type
      title: ThreadMetadataChunk
    Request:
      anyOf:
      - $ref: '#/components/schemas/ExecuteRequestV1'
      - $ref: '#/components/schemas/ExecuteRequestV2'
      title: Request
    Request_1:
      discriminator:
        mapping:
          v1: '#/components/schemas/QueryRequestV1'
          v2: '#/components/schemas/QueryRequestV2'
        propertyName: version
      oneOf:
      - $ref: '#/components/schemas/QueryRequestV1'
      - $ref: '#/components/schemas/QueryRequestV2'
      title: Request
    ExecuteRequestV1_ai_primitives_llm:
      discriminator:
        mapping:
          anthropic: '#/components/schemas/ApiAnthropicConfig'
          hasura: '#/components/schemas/HasuraLlmConfigV1'
          openai: '#/components/schemas/ApiOpenAIConfig'
        propertyName: provider
      nullable: true
      oneOf:
      - $ref: '#/components/schemas/HasuraLlmConfigV1'
      - $ref: '#/components/schemas/ApiOpenAIConfig'
      - $ref: '#/components/schemas/ApiAnthropicConfig'
    ExecuteRequestV1_artifacts_inner:
      discriminator:
        mapping:
          automation: '#/components/schemas/AutomationArtifact'
          table: '#/components/schemas/TableArtifact'
          text: '#/components/schemas/TextArtifact'
          visualization: '#/components/schemas/VisualizationArtifact'
        propertyName: artifact_type
      oneOf:
      - $ref: '#/components/schemas/TextArtifact'
      - $ref: '#/components/schemas/TableArtifact'
      - $ref: '#/components/schemas/VisualizationArtifact'
      - $ref: '#/components/schemas/AutomationArtifact'
    Llm:
      discriminator:
        mapping:
          anthropic: '#/components/schemas/ApiAnthropicConfig'
          hasura: '#/components/schemas/HasuraLlmConfigV1'
          openai: '#/components/schemas/ApiOpenAIConfig'
        propertyName: provider
      oneOf:
      - $ref: '#/components/schemas/HasuraLlmConfigV1'
      - $ref: '#/components/schemas/ApiOpenAIConfig'
      - $ref: '#/components/schemas/ApiAnthropicConfig'
      title: Llm
    ValidationError_loc_inner:
      anyOf:
      - type: string
      - type: integer
    Artifact:
      discriminator:
        mapping:
          automation: '#/components/schemas/AutomationArtifact'
          table: '#/components/schemas/TableArtifact'
          text: '#/components/schemas/TextArtifact'
          visualization: '#/components/schemas/VisualizationArtifact'
        propertyName: artifact_type
      oneOf:
      - $ref: '#/components/schemas/TextArtifact'
      - $ref: '#/components/schemas/TableArtifact'
      - $ref: '#/components/schemas/VisualizationArtifact'
      - $ref: '#/components/schemas/AutomationArtifact'
      title: Artifact
